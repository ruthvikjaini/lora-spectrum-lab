[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-spectrum-lab"
version = "0.1.0"
description = "Spectral and subspace dynamics of LoRA under SFT and RL (reproduction of arXiv:2611.08414)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
